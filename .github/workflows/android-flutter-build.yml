name: App Guard Android + Flutter build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'flutter_ui/**'
      - 'tools/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/android-flutter-build.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android SDK diagnostics
        run: |
          flutter doctor -v
          java -version

      - name: Prepare Flutter add-to-app module
        run: bash tools/prepare_flutter_phase4.sh

      - name: Resolve Flutter packages
        working-directory: flutter_module
        run: flutter pub get

      - name: Analyze Flutter UI
        working-directory: flutter_module
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: flutter_module
        run: flutter test

      - name: Build Android debug APK
        run: bash ./gradlew --no-daemon --stacktrace -PenableFlutterHost=true :app:assembleDebug

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-guard-android-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 14
